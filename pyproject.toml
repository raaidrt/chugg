[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chugg"
version = "0.1.0"
description = "An offline, device-only chess opening trainer"
requires-python = ">=3.14,<3.15"
dependencies = ["chess==1.11.2"]

[project.scripts]
chugg = "chugg.cli:main"

[dependency-groups]
dev = ["basedpyright>=1.31", "pytest>=8.4", "ruff>=0.12", "resvg-py>=0.3.3", "pillow>=11"]

[tool.basedpyright]
include = ["src", "tests", "scripts"]
stubPath = "typings"
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
